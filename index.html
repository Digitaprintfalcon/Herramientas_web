<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Herramientas Web</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-16x16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#059669" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Estilos comunes del panel (tokens, fuentes y tema) -->
  <link rel="stylesheet" href="tools/common.css">
  <style>
    body {
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .main-container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .header-title {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .header-subtitle {
      color: var(--hw-text-muted);
      font-size: 0.95rem;
    }

    .search-wrapper {
      margin-bottom: 2rem;
      display: flex;
      justify-content: center;
    }

    .search-input {
      width: 100%;
      max-width: 480px;
      padding: 0.8rem 1.2rem;
      border-radius: 1rem;
      border: 1px solid var(--hw-border-strong);
      background: var(--hw-card-soft);
      color: var(--hw-text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.3s ease;
    }

    .search-input:focus {
      border-color: var(--hw-accent);
      box-shadow: 0 0 0 0.25rem rgba(5, 150, 105, 0.15);
    }

    .search-input::placeholder {
      color: var(--hw-text-muted);
      opacity: 1;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1.5rem;
    }

    .tool-card {
      background: var(--hw-card);
      border: 1px solid var(--hw-border);
      border-radius: 1.5rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.1), 0 8px 10px -6px rgba(15, 23, 42, 0.06);
      transition: transform 0.2s ease, border-color 0.2s ease, background-color 0.3s ease;
    }

    .tool-card:hover {
      transform: translateY(-4px);
      border-color: var(--hw-accent);
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .category-badge {
      font-size: 0.72rem;
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge-finanzas    { background: rgba(16, 185, 129, 0.12); color: #047857; }
    .badge-produccion  { background: rgba(30, 64, 175, 0.12); color: #1e40af; }
    .badge-consultas   { background: rgba(2, 132, 199, 0.12); color: #0369a1; }
    .badge-utilidades  { background: rgba(100, 116, 139, 0.15); color: #475569; }
    .badge-documentos  { background: rgba(217, 119, 6, 0.13); color: #b45309; }

    html.dark .badge-finanzas   { color: #34d399; }
    html.dark .badge-produccion { color: #818cf8; }
    html.dark .badge-consultas  { color: #38bdf8; }
    html.dark .badge-utilidades { color: #94a3b8; }
    html.dark .badge-documentos { color: #fbbf24; }

    .tool-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--hw-text-main);
      margin-bottom: 0.35rem;
    }

    /* Icono de cada tarjeta: ancho fijo, centrado y separación uniforme */
    .tool-title i {
      display: inline-block;
      width: 1.25rem;
      text-align: center;
      margin-right: 0.6rem;
      vertical-align: -0.08em;
      color: var(--hw-accent);
    }

    .tool-description {
      color: var(--hw-text-muted);
      font-size: 0.88rem;
      margin-bottom: 1.5rem;
      line-height: 1.45;
    }

    .action-button {
      display: block;
      text-align: center;
      background: var(--hw-accent);
      color: #ffffff;
      text-decoration: none;
      padding: 0.7rem 1rem;
      border-radius: 0.9rem;
      font-weight: 600;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .action-button:hover {
      background: var(--hw-accent-dark);
      color: #ffffff;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <div class="main-container">

    <header class="d-flex justify-content-between align-items-center gap-3 flex-wrap mb-5">
      <div class="d-flex align-items-center gap-3">
        <div class="hw-brand-icon"><i class="bi bi-grid-1x2-fill"></i></div>
        <div>
          <h1 class="header-title mb-0">Centro de Herramientas</h1>
          <p class="header-subtitle mb-0">Selecciona la utilidad que necesitas ejecutar</p>
        </div>
      </div>
      <div class="d-flex align-items-center gap-2">
        <div class="dropdown">
          <button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown"><i class="bi bi-gear me-1"></i>Configuración</button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><button class="dropdown-item" type="button" data-bs-toggle="modal" data-bs-target="#preciosConfigModal"><i class="bi bi-currency-dollar me-2"></i>Precios por defecto</button></li>
          </ul>
        </div>
        <button class="hw-theme-toggle" type="button" title="Cambiar tema" aria-label="Cambiar tema">
          <i class="bi bi-moon-stars"></i><i class="bi bi-sun"></i>
        </button>
      </div>
    </header>

    <div class="search-wrapper">
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Buscar herramienta..."
        onkeyup="filterTools()"
      >
    </div>

    <main class="tools-grid" id="toolsGrid">
      <!-- Tarjetas generadas por HW.renderCatalog() desde HW_TOOLS (fuente única) -->
    </main>
  </div>

  <!-- Utilidades compartidas del panel (tema y catálogo) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="tools/common.js"></script>
  <script src="tools/prices-client.js"></script>
  <script src="script.js"></script>

  <script>
    if (window.HW && HW.renderCatalog) HW.renderCatalog('toolsGrid');

    function filterTools() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const cards = document.querySelectorAll('.tool-card');

      cards.forEach(card => {
        const keywords = card.getAttribute('data-keywords').toLowerCase();
        if (keywords.includes(query)) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    }
  </script>

  <!-- Modal Precios por defecto -->
  <div class="modal fade" id="preciosConfigModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-xl">
      <div class="modal-content">
        <div class="modal-header py-2">
          <h5 class="modal-title"><i class="bi bi-currency-dollar me-1"></i>Precios por defecto</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
            <div class="text-muted small" id="preciosLastMod">Última modificación: -</div>
            <div class="d-flex flex-wrap gap-2">
              <button class="btn btn-outline-secondary btn-sm" id="btnPreciosExportar"><i class="bi bi-download me-1"></i>Exportar JSON</button>
              <label class="btn btn-outline-secondary btn-sm mb-0"><i class="bi bi-upload me-1"></i>Importar JSON<input type="file" id="inputPreciosImportar" accept="application/json" hidden></label>
              <button class="btn btn-outline-warning btn-sm" id="btnPreciosReset"><i class="bi bi-arrow-counterclockwise me-1"></i>Restaurar valores por defecto</button>
              <button class="btn btn-primary btn-sm" id="btnPreciosGuardar"><i class="bi bi-save me-1"></i>Guardar</button>
            </div>
          </div>
          <ul class="nav nav-tabs" id="preciosTabs" role="tablist">
            <li class="nav-item" role="presentation"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-precios-vinil" type="button">Vinil</button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-precios-banner" type="button">Banner</button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-precios-cut" type="button">Cut</button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-precios-dtf" type="button">DTF</button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-precios-pvc" type="button">PVC</button></li>
          </ul>
          <div class="tab-content border border-top-0 p-3">
            <div class="tab-pane fade show active" id="tab-precios-vinil">
              <div class="row g-2">
                <div class="col-12 col-md-4"><label class="form-label form-label-sm">Precio Vinil ($/m²)</label><input type="number" step="0.01" min="0" class="form-control form-control-sm" id="pr-vinil-precioVinilM2"></div>
                <div class="col-12 col-md-4"><label class="form-label form-label-sm">Precio Laminado ($/m²)</label><input type="number" step="0.01" min="0" class="form-control form-control-sm" id="pr-vinil-precioLaminadoM2"></div>
                <div class="col-12 col-md-4"><label class="form-label form-label-sm">Costo Diseño ($)</label><input type="number" step="0.01" min="0" class="form-control form-control-sm" id="pr-vinil-costoDiseno"></div>
                <div class="col-12 col-md-4"><label class="form-label form-label-sm">Costo Corte ($)</label><input type="number" step="0.01" min="0" class="form-control form-control-sm" id="pr-vinil-costoCorte"></div>
                <div class="col-12 col-md-4"><label class="form-label form-label-sm">Costo Instalación ($)</label><input type="number" step="0.01" min="0" class="form-control form-control-sm" id="pr-vinil-costoInstalacion"></div>
              </div>
            </div>
            <div class="tab-pane fade" id="tab-precios-banner">
              <div class="row g-2">
                <div class="col-12 col-md-6"><label class="form-label form-label-sm">Precio Banner ($/m²)</label><input type="number" step="0.01" min="0" class="form-control form-control-sm" id="pr-banner-precioM2"></div>
                <div class="col-12 col-md-6"><label class="form-label form-label-sm">Costo Logístico ($)</label><input type="number" step="0.01" min="0" class="form-control form-control-sm" id="pr-banner-costoLogistica"></div>
              </div>
            </div>
            <div class="tab-pane fade" id="tab-precios-cut">
              <div class="row g-2">
                <div class="col-12 col-md-4"><label class="form-label form-label-sm">Precio Material ($/m²)</label><input type="number" step="0.01" min="0" class="form-control form-control-sm" id="pr-cut-precioMaterialM2"></div>
                <div class="col-12 col-md-4"><label class="form-label form-label-sm">Costo Planchado ($)</label><input type="number" step="0.01" min="0" class="form-control form-control-sm" id="pr-cut-costoPlanchado"></div>
                <div class="col-12 col-md-4"><label class="form-label form-label-sm">Costo Instalación ($)</label><input type="number" step="0.01" min="0" class="form-control form-control-sm" id="pr-cut-costoInstalacion"></div>
              </div>
            </div>
            <div class="tab-pane fade" id="tab-precios-dtf">
              <div class="row g-2">
                <div class="col-12 col-md-4"><label class="form-label form-label-sm">Precio por metro ($)</label><input type="number" step="0.01" min="0" class="form-control form-control-sm" id="pr-dtf-precioMetro"></div>
                <div class="col-12 col-md-4"><label class="form-label form-label-sm">Costo Planchado ($)</label><input type="number" step="0.01" min="0" class="form-control form-control-sm" id="pr-dtf-costoPlanchado"></div>
                <div class="col-12 col-md-4"><label class="form-label form-label-sm">Costo Prenda ($)</label><input type="number" step="0.01" min="0" class="form-control form-control-sm" id="pr-dtf-costoPrenda"></div>
              </div>
            </div>
            <div class="tab-pane fade" id="tab-precios-pvc">
              <div class="row g-2">
                <div class="col-12 col-md-4"><label class="form-label form-label-sm">PVC Hoja ($)</label><input type="number" step="0.01" min="0" class="form-control form-control-sm" id="pr-pvc-precioPvcHoja"></div>
                <div class="col-12 col-md-4"><label class="form-label form-label-sm">Vinil ($/m²)</label><input type="number" step="0.01" min="0" class="form-control form-control-sm" id="pr-pvc-precioVinilM2"></div>
                <div class="col-12 col-md-4"><label class="form-label form-label-sm">Laminado ($/m²)</label><input type="number" step="0.01" min="0" class="form-control form-control-sm" id="pr-pvc-precioLaminadoM2"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer py-2">
          <button class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
