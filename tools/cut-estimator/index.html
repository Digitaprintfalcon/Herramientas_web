<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Precio - Vinil</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
        
</head>
<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card p-4">
                    <h4 class="fw-bold mb-1">Calculadora de Precio - Vinil / Vinil textil</h4>
                    <p class="text-muted small mb-4">Cálculo proporcional por área para corte en vinil / vinil textil</p>
                    
                    <form id="calcForm">
                        <!-- Método de Cálculo -->
                        <div class="mb-3">
                            <label for="metodo" class="form-label">Método de Cálculo de Material</label>
                            <select class="form-select" id="metodo" onchange="cambiarMetodo()">
                                <option value="lineal">Por Rollo / Metro Lineal</option>
                                <option value="area">Por Metro Cuadrado ($/m²)</option>
                            </select>
                        </div>

                        <!-- Medidas del Diseño -->
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label">Ancho Diseño</label>
                                <div class="input-group">
                                    <input type="number" class="form-control" id="anchoDiseno" step="0.1" value="20" oninput="calcularCosto()">
                                    <span class="input-group-text">cm</span>
                                </div>
                            </div>
                            <div class="col-6">
                                <label class="form-label">Alto Diseño</label>
                                <div class="input-group">
                                    <input type="number" class="form-control" id="altoDiseno" step="0.1" value="15" oninput="calcularCosto()">
                                    <span class="input-group-text">cm</span>
                                </div>
                            </div>
                        </div>

                        <!-- Dimensiones del Material / Rollo -->
                        <div class="row g-2 mb-3" id="seccionRollo">
                            <div class="col-6">
                                <label class="form-label">Ancho del Rollo</label>
                                <div class="input-group">
                                    <input type="number" class="form-control" id="anchoRollo" step="0.1" value="50" oninput="calcularCosto()">
                                    <span class="input-group-text">cm</span>
                                </div>
                            </div>
                            <div class="col-6" id="colPrecioRollo">
                                <label class="form-label" id="labelPrecioMaterial">Precio Metro Lineal</label>
                                <div class="input-group">
                                    <input type="number" class="form-control" id="precioMaterial" step="0.01" value="3.50" oninput="calcularCosto()">
                                    <span class="input-group-text">$</span>
                                </div>
                            </div>
                        </div>

                        <!-- Cantidad de Piezas -->
                        <div class="row g-2 mb-3">
                            <div class="col-12">
                                <label class="form-label">Cantidad de Piezas</label>
                                <div class="input-group">
                                    <input type="number" class="form-control" id="cantidadPiezas" step="1" value="1" oninput="calcularCosto()">
                                    <span class="input-group-text">un.</span>
                                </div>
                            </div>
                        </div>

                        <!-- Margen de Ganancia -->
                        <div class="mb-3">
                            <label class="form-label">Margen de Ganancia</label>
                            <div class="input-group">
                                <input type="number" class="form-control" id="margenGanancia" step="1" value="40" oninput="calcularCosto()">
                                <span class="input-group-text">%</span>
                            </div>
                        </div>

                        <!-- Sección 1: Servicio Opcional para Vinil Textil (Planchado) -->
                        <div class="card p-3 mb-3 bg-white">
                            <div class="form-check form-switch d-flex align-items-center justify-content-between p-0">
                                <label class="form-check-label fw-semibold text-dark m-0" for="incluirPlanchado">Vinil Textil: Servicio de Planchado</label>
                                <input class="form-check-input ms-2" type="checkbox" role="switch" id="incluirPlanchado" style="width: 2.5em; height: 1.25em;" onchange="calcularCosto()">
                            </div>
                            <div class="mt-2" id="divCostoPlanchado" style="display: none;">
                                <label class="form-label small">Costo extra por planchado (c/u)</label>
                                <div class="input-group input-group-sm">
                                    <input type="number" class="form-control" id="costoPlanchado" step="0.01" value="0.50" oninput="calcularCosto()">
                                    <span class="input-group-text">$</span>
                                </div>
                            </div>
                        </div>

                        <!-- Sección 2: Servicio Opcional para Vinil Común (Instalación) -->
                        <div class="card p-3 mb-4 bg-white">
                            <div class="form-check form-switch d-flex align-items-center justify-content-between p-0">
                                <label class="form-check-label fw-semibold text-dark m-0" for="incluirInstalacion">Vinil Común: Costos de Instalación</label>
                                <input class="form-check-input ms-2" type="checkbox" role="switch" id="incluirInstalacion" style="width: 2.5em; height: 1.25em;" onchange="calcularCosto()">
                            </div>
                            <div class="mt-2" id="divCostoInstalacion" style="display: none;">
                                <label class="form-label small">Costo extra por instalación (c/u)</label>
                                <div class="input-group input-group-sm">
                                    <input type="number" class="form-control" id="costoInstalacion" step="0.01" value="1.00" oninput="calcularCosto()">
                                    <span class="input-group-text">$</span>
                                </div>
                            </div>
                        </div>
                    </form>

                    <!-- Resultados -->
                    <div class="result-box-unitario p-3 text-center mb-3">
                        <span class="text-uppercase fw-bold fs-7 d-block">Precio Unitario (Diseño)</span>
                        <h2 class="fw-bold mb-0" id="resPrecioUnitario">$0.00</h2>
                    </div>

                    <div class="result-box-total p-3 text-center mb-3">
                        <span class="text-uppercase fw-bold fs-7 d-block" id="labelTotalTitulo">Precio Total</span>
                        <h2 class="fw-bold mb-0" id="resPrecioTotal">$0.00</h2>
                    </div>

                    <!-- Texto de la fórmula aplicada -->
                    <div class="formula-text text-center" id="textoFormula">
                        Fórmula aplicada: ...
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="script.js" /></script>
</body>
</html>
