<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Código QR</title>
    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Estilos adicionales para centrar el QR */
        #qrcode img, #qrcode canvas {
            margin: 0 auto;
            padding: 10px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-4 text-center">

                        <h2 class="card-title fw-bold mb-4 text-primary">Generador de QR</h2>
                        
                        <!-- Formulario de entrada -->
                        <div class="mb-3 text-start">
                            <label for="text-input" class="form-label fw-semibold">Introduce el texto o enlace (URL):</label>
                            <textarea 
                                id="text-input" 
                                class="form-rows-3 form-control" 
                                placeholder="Ej: https://miweb.com o Hola Mundo"
                                rows="3"></textarea>
                        </div>

                        <!-- Botón para generar -->
                        <div class="d-grid mb-4">
                            <button id="generate-btn" class="btn btn-primary btn-lg fw-bold">Generar QR</button>
                        </div>

                        <!-- Contenedor del QR -->
                        <div id="qr-container" class="d-none">
                            <hr class="my-4">
                            <h5 class="fw-bold mb-3">Tu código QR:</h5>
                            <div id="qrcode" class="mb-3"></div>
                            
                            <!-- Botón de Descarga -->
                            <a id="download-btn" class="btn btn-success btn-sm mt-2" download="codigo-qr.png" href="#">
                                Descargar Imagen
                            </a>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Librería QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Script de JavaScript personalizado -->
    <script>
        // Obtener elementos del DOM
        const textInput = document.getElementById('text-input');
        const generateBtn = document.getElementById('generate-btn');
        const qrContainer = document.getElementById('qr-container');
        const qrcodeDiv = document.getElementById('qrcode');
        const downloadBtn = document.getElementById('download-btn');

        let qrCodeObj = null;

        // Función para generar el código QR
        function generateQR() {
            const text = textInput.value.trim();

            if (text === "") {
                alert("Por favor, introduce algún texto o enlace.");
                return;
            }

            // Limpiar el contenedor de QR previo
            qrcodeDiv.innerHTML = "";

            // Generar nuevo QR usando la librería QRCode.js
            qrCodeObj = new QRCode(qrcodeDiv, {
                text: text,
                width: 200,
                height: 200,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            // Mostrar la sección del QR
            qrContainer.classList.remove('d-none');

            // Preparar el botón de descarga (espera un pequeño instante a que el Canvas/Image se procese)
            setTimeout(() => {
                const img = qrcodeDiv.querySelector('img');
                const canvas = qrcodeDiv.querySelector('canvas');
                
                if (img && img.src) {
                    downloadBtn.href = img.src;
                } else if (canvas) {
                    downloadBtn.href = canvas.toDataURL("image/png");
                }
            }, 50);
        }

        // Event listener para el botón
        generateBtn.addEventListener('click', generateQR);

        // Opcional: Generar al presionar la tecla "Enter" dentro del textarea (sin Shift)
        textInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                generateQR();
            }
        });
    </script>
</body>
</html>
