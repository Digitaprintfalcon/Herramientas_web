<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Código QR</title>
    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Estilos comunes del panel -->
    <link rel="stylesheet" href="../common.css">
    <style>
        /* Estilos adicionales para centrar el QR */
        #qrcode img, #qrcode canvas {
            margin: 0 auto;
            padding: 10px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="bg-body-tertiary d-flex flex-column align-items-center min-vh-100">

    <div class="tool-nav">
        <a class="tool-nav-back" href="../../index.html"><i class="bi bi-arrow-left"></i> Volver al panel</a>
        <div class="tool-nav-titles">
            <h1 class="tool-nav-title">Generador QR</h1>
            <p class="tool-nav-sub">Crea códigos QR para textos y enlaces</p>
        </div>
    </div>

    <div class="container my-auto py-4">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow border-0 rounded-4">
                    <div class="card-body p-4 text-center">

                        <h2 class="hw-card-title h4 mb-4"><i class="bi bi-qr-code text-primary me-2"></i>Generador de QR</h2>

                        <!-- Selector de modo -->
                        <div class="btn-group w-100 mb-3" role="group" aria-label="Modo de generación">
                            <button type="button" class="btn btn-primary active" id="mode-text">
                                <i class="bi bi-fonts me-1"></i>Texto
                            </button>
                            <button type="button" class="btn btn-outline-primary" id="mode-link">
                                <i class="bi bi-link-45deg me-1"></i>Enlace (URL)
                            </button>
                        </div>

                        <!-- Panel: Texto -->
                        <div id="panel-text" class="mb-3 text-start">
                            <label for="text-input" class="form-label fw-semibold small text-secondary">Introduce el texto (admite varias líneas):</label>
                            <textarea 
                                id="text-input" 
                                class="form-control" 
                                placeholder="Ej: Hola Mundo, notas, números de seguimiento..."
                                rows="6"></textarea>
                            <small id="char-count" class="text-muted">0 caracteres</small>
                        </div>

                        <!-- Panel: Enlace -->
                        <div id="panel-link" class="mb-3 text-start d-none">
                            <label for="url-input" class="form-label fw-semibold small text-secondary">Pega el enlace (URL):</label>
                            <div class="input-group">
                                <input 
                                    type="url" 
                                    id="url-input" 
                                    class="form-control"
                                    placeholder="https://miweb.com"
                                    autocomplete="off">
                                <button class="btn btn-outline-primary" type="button" id="btn-open-link" title="Abrir enlace en una pestaña nueva">
                                    <i class="bi bi-box-arrow-up-right"></i>
                                </button>
                            </div>
                            <small id="url-hint" class="text-muted d-none">Se antepondrá https:// si no lo incluyes.</small>
                        </div>

                        <!-- Botón para generar -->
                        <div class="d-grid mb-4">
                            <button id="generate-btn" class="btn btn-primary btn-lg fw-bold"><i class="bi bi-qr-code-scan me-2"></i>Generar QR</button>
                        </div>

                        <!-- Contenedor del QR -->
                        <div id="qr-container" class="d-none">
                            <hr class="my-4">
                            <h5 class="fw-bold mb-3">Tu código QR:</h5>
                            <div id="qrcode" class="mb-3"></div>
                            
                            <!-- Botón de Descarga -->
                            <a id="download-btn" class="btn btn-success btn-sm mt-2" download="codigo-qr.png" href="#">
                                <i class="bi bi-download me-1"></i>Descargar Imagen
                            </a>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Librería qrcode (node-qrcode): soporta textos largos y UTF-8 -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.js"></script>

    <!-- Script de JavaScript personalizado -->
    <script>
        // Obtener elementos del DOM
        const modeTextBtn = document.getElementById('mode-text');
        const modeLinkBtn = document.getElementById('mode-link');
        const panelText = document.getElementById('panel-text');
        const panelLink = document.getElementById('panel-link');
        const textInput = document.getElementById('text-input');
        const urlInput = document.getElementById('url-input');
        const charCount = document.getElementById('char-count');
        const urlHint = document.getElementById('url-hint');
        const openLinkBtn = document.getElementById('btn-open-link');
        const generateBtn = document.getElementById('generate-btn');
        const qrContainer = document.getElementById('qr-container');
        const qrcodeDiv = document.getElementById('qrcode');
        const downloadBtn = document.getElementById('download-btn');

        let currentMode = 'texto';

        // Cambiar de modo
        function setMode(mode) {
            currentMode = mode;
            const esTexto = mode === 'texto';

            modeTextBtn.className = esTexto ? 'btn btn-primary active' : 'btn btn-outline-primary';
            modeLinkBtn.className = esTexto ? 'btn btn-outline-primary' : 'btn btn-primary active';

            panelText.classList.toggle('d-none', !esTexto);
            panelLink.classList.toggle('d-none', esTexto);

            if (!esTexto) {
                urlHint.classList.remove('d-none');
            }

            if (obtenerValorActual().trim() !== '') {
                generateQR();
            }
        }

        modeTextBtn.addEventListener('click', () => setMode('texto'));
        modeLinkBtn.addEventListener('click', () => setMode('enlace'));

        // Valor activo según el modo
        function obtenerValorActual() {
            if (currentMode === 'enlace') {
                let valor = urlInput.value.trim();
                if (valor !== '' && !/^https?:\/\//i.test(valor)) {
                    valor = 'https://' + valor;
                }
                return valor;
            }
            return textInput.value;
        }

        // Contador de caracteres
        textInput.addEventListener('input', () => {
            charCount.textContent = textInput.value.length + ' caracteres';
        });

        // Abrir el enlace en una pestaña nueva
        openLinkBtn.addEventListener('click', () => {
            const url = obtenerValorActual();
            if (/^https?:\/\//i.test(url)) {
                window.open(url, '_blank', 'noopener');
            }
        });

        // Función para generar el código QR
        function generateQR() {
            const text = obtenerValorActual().trim();

            if (text === "") {
                (currentMode === 'enlace' ? urlInput : textInput).focus();
                qrContainer.classList.add('d-none');
                alert(currentMode === 'enlace'
                    ? "Por favor, introduce un enlace."
                    : "Por favor, introduce algún texto.");
                return;
            }

            // Limpiar el contenedor de QR previo
            qrcodeDiv.innerHTML = "";

            // Generar nuevo QR usando la librería qrcode (node-qrcode)
            const niveles = ['H', 'M', 'L'];
            let intento = 0;
            const generar = () => {
                if (intento >= niveles.length) {
                    alert("El texto es demasiado largo para generar un código QR escaneable.");
                    return;
                }
                QRCode.toDataURL(text, {
                    width: 300,
                    margin: 2,
                    errorCorrectionLevel: niveles[intento],
                    color: { dark: '#000000', light: '#ffffff' }
                }).then(url => {
                    qrcodeDiv.innerHTML = "";
                    const img = document.createElement('img');
                    img.src = url;
                    img.alt = 'Código QR';
                    qrcodeDiv.appendChild(img);

                    // Mostrar la sección del QR y preparar la descarga
                    qrContainer.classList.remove('d-none');
                    downloadBtn.href = url;
                }).catch(() => {
                    intento += 1;
                    generar();
                });
            };
            generar();
        }

        // Event listener para el botón
        generateBtn.addEventListener('click', generateQR);

        // Generar al presionar "Enter" (siempre que el campo activo tenga foco)
        textInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                generateQR();
            }
        });

        urlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                generateQR();
            }
        });
    </script>

    <!-- Utilidades compartidas del panel -->
    <script src="../common.js"></script>
</body>
</html>
