<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora BCV - Conversión USD / EUR a VES</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="icon" href="../../favicon-16x16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png" sizes="180x180">
<link rel="manifest" href="../../site.webmanifest">
<meta name="theme-color" content="#059669" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Estilos comunes del panel -->
  <link rel="stylesheet" href="../common.css">
  <style>
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }

    #rateValue {
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--hw-text-main);
    }

    #rateInput {
      width: 6rem;
      text-align: right;
      font-weight: 700;
      font-size: 0.8rem;
    }

    /* El toast invisible no debe interceptar clics de la tarjeta */
    #toast {
      pointer-events: none;
    }

    /* Selector de modo (BCV / Euro) */
    .hw-seg {
      display: flex;
      gap: 0.35rem;
      padding: 0.3rem;
      background: var(--hw-card-soft);
      border: 1px solid var(--hw-border);
      border-radius: 0.9rem;
    }

    .hw-seg-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.5rem 0.6rem;
      border: 1px solid transparent;
      border-radius: 0.65rem;
      background: transparent;
      color: var(--hw-text-muted);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .hw-seg-btn:hover {
      color: var(--hw-text-main);
      background: var(--hw-border);
    }

    .hw-seg-btn.is-active {
      background: var(--hw-card);
      border-color: var(--hw-accent);
      color: var(--hw-accent-dark);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12);
    }

    html.dark .hw-seg-btn.is-active {
      color: var(--hw-accent-bright);
    }

    /* Pill de tasa estimada (respaldo derivado del dólar) */
    .hw-status-estimated {
      background: rgba(2, 132, 199, 0.15);
      color: #0369a1;
    }

    html.dark .hw-status-estimated {
      color: #38bdf8;
    }
  </style>
</head>
<body class="bg-body-tertiary d-flex flex-column align-items-center min-vh-100">

  <div class="tool-nav">
    <a class="tool-nav-back" href="../../index.html"><i class="bi bi-arrow-left"></i> Volver al panel</a>
    <div class="tool-nav-titles">
      <h1 class="tool-nav-title">Calculadora BCV</h1>
      <p class="tool-nav-sub">Conversión directa USD ↔ VES y EUR ↔ VES con las tasas BCV en tiempo real</p>
    </div>
  </div>

  <div class="container my-auto py-4">
    <div class="row justify-content-center">
      <div class="col-11 col-sm-8 col-md-6 col-lg-5 col-xl-4">
        <div class="card p-4 d-flex flex-column gap-4" style="border-radius: 1.5rem;">

          <!-- Encabezado -->
          <div class="d-flex align-items-center justify-content-between border-bottom pb-4" style="border-color: var(--hw-border) !important;">
            <div class="d-flex align-items-center gap-3">
              <div class="hw-brand-icon"><i class="bi bi-calculator"></i></div>
              <div>
                <h1 class="fs-5 fw-bold mb-0" style="color: var(--hw-text-main);">Calculadora BCV</h1>
                <p class="mb-0 fw-medium" style="font-size: 0.78rem; color: var(--hw-text-muted);">Conversión directa a Bolívares</p>
              </div>
            </div>
          </div>

          <!-- Selector de modo -->
          <div class="hw-seg" role="group" aria-label="Moneda de la tasa">
            <button type="button" class="hw-seg-btn is-active" data-modo="usd"
              onclick="setModo('usd')" aria-pressed="true">
              <i class="bi bi-currency-dollar"></i> Tasa BCV
            </button>
            <button type="button" class="hw-seg-btn" data-modo="eur"
              onclick="setModo('eur')" aria-pressed="false">
              <i class="bi bi-currency-euro"></i> Tasa Euro
            </button>
          </div>

          <!-- Tasa oficial -->
          <div class="hw-box p-3">
            <div class="d-flex justify-content-between align-items-center mb-2 gap-2">
              <span id="rateLabel" class="hw-uppercase-label">Tasa Oficial BCV</span>
              <span id="statusTag" class="hw-status-pill hw-status-live"><i class="bi bi-wifi"></i> En vivo</span>
            </div>
            <div class="d-flex justify-content-between align-items-center gap-3 flex-wrap">
              <div class="d-flex align-items-baseline gap-1">
                <span id="rateValue">--.--</span>
                <span id="rateUnit" class="small fw-semibold" style="color: var(--hw-text-muted);">Bs/$</span>
              </div>
              <div class="d-flex align-items-center gap-2">
                <input type="number" id="rateInput" placeholder="Tasa" step="any" min="0.01"
                  oninput="onManualRateChange(this.value)"
                  class="form-control form-control-sm">
                <button id="syncBtn" class="hw-sync-btn" type="button" title="Sincronizar BCV" onclick="fetchBcvRate()">
                  <i id="syncIcon" class="bi bi-arrow-repeat"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- Campos de conversión -->
          <div class="d-flex flex-column gap-1">
            <div id="fxBox">
              <label for="fxInput" id="fxLabel" class="hw-field-label hw-field-label-emerald mb-2"><i class="bi bi-currency-dollar" id="fxIcon"></i> <span id="fxLabelText">Dólares (USD)</span></label>
              <div class="hw-field-wrap">
                <span class="hw-field-prefix" id="fxPrefix">$</span>
                <input type="number" id="fxInput" placeholder="0.00" min="0" step="any"
                  oninput="convertirDesde(this.value)"
                  class="form-control hw-field-input">
              </div>
            </div>

            <div class="d-flex justify-content-center" style="margin: -0.85rem 0 -0.5rem;">
              <button onclick="swapFields()" title="Intercambiar campos" class="hw-swap-btn" type="button">
                <i class="bi bi-arrow-down-up"></i>
              </button>
            </div>

            <div id="bsBox">
              <label for="bsInput" class="hw-field-label hw-field-label-blue mb-2"><i class="bi bi-bank"></i> Bolívares (VES)</label>
              <div class="hw-field-wrap">
                <span class="hw-field-prefix">Bs</span>
                <input type="number" id="bsInput" placeholder="0.00" min="0" step="any"
                  oninput="convertirHacia(this.value)"
                  class="form-control hw-field-input">
              </div>
            </div>
          </div>

          <!-- Montos rápidos -->
          <div>
            <span id="quickLabel" class="hw-uppercase-label d-block mb-2">Montos Rápidos USD</span>
            <div class="row g-2">
              <div class="col"><button onclick="setQuickAmount(5)" data-amount="5" class="hw-chip hw-chip-emerald w-100">$5</button></div>
              <div class="col"><button onclick="setQuickAmount(10)" data-amount="10" class="hw-chip hw-chip-emerald w-100">$10</button></div>
              <div class="col"><button onclick="setQuickAmount(20)" data-amount="20" class="hw-chip hw-chip-emerald w-100">$20</button></div>
              <div class="col"><button onclick="setQuickAmount(50)" data-amount="50" class="hw-chip hw-chip-emerald w-100">$50</button></div>
              <div class="col"><button onclick="setQuickAmount(100)" data-amount="100" class="hw-chip hw-chip-emerald w-100">$100</button></div>
            </div>
          </div>

          <!-- Acciones -->
          <div class="row g-3 pt-1">
            <div class="col-6">
              <button onclick="copyResult()" class="btn btn-primary hw-btn-lg w-100">
                <i class="bi bi-copy me-1"></i>Copiar Resultado
              </button>
            </div>
            <div class="col-6">
              <button onclick="clearInputs()" class="btn hw-btn-lg hw-btn-ghost w-100">
                <i class="bi bi-eraser me-1"></i>Limpiar
              </button>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Toast de notificación -->
  <div id="toast" class="hw-toast">
    <i id="toastIcon" class="bi bi-check-circle-fill"></i>
    <span id="toastMsg">Mensaje</span>
  </div>

  <!-- Utilidades compartidas del panel -->
  <script src="../common.js"></script>

  <script src="script.js"></script>
</body>
</html>
