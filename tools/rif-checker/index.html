<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Contribuyente SIGAT</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Estilos comunes del panel -->
    <link rel="stylesheet" href="../common.css">
</head>
<body class="bg-body-tertiary d-flex flex-column align-items-center min-vh-100">

    <div class="tool-nav">
        <a class="tool-nav-back" href="../../index.html"><i class="bi bi-arrow-left"></i> Volver al panel</a>
        <div class="tool-nav-titles">
            <h1 class="tool-nav-title">Consulta de RIF / Cédula</h1>
            <p class="tool-nav-sub">Verifica datos del Registro de Información Fiscal (SIGAT)</p>
        </div>
    </div>
    
    <div class="container my-auto py-4">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <!-- Tarjeta Principal -->
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h4 class="mb-0"><i class="bi bi-person-badge me-2"></i>Consulta de RIF / Cédula</h4>
                    </div>
                    
                    <div class="card-body p-4">
                        <form id="searchForm" onsubmit="event.preventDefault(); buscarContribuyente();">
                            <label for="cedulaInput" class="form-label fw-semibold small text-secondary">Número de Cédula:</label>
                            <div class="input-group mb-3">
                                <span class="input-group-text bg-white">V-</span>
                                <input type="number" id="cedulaInput" class="form-control" placeholder="Ej: 12345678" required min="1" step="1">
                                <button class="btn btn-primary px-4" type="submit" id="btnConsultar">
                                    <span id="btnSpinner" class="spinner-border spinner-border-sm d-none me-1" role="status" aria-hidden="true"></span>
                                    <span id="btnText"><i class="bi bi-search me-1"></i>Buscar</span>
                                </button>
                            </div>
                        </form>

                        <!-- Mensaje de Alerta / Error -->
                        <div id="alertBox" class="alert alert-danger d-none mt-3" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i><span id="alertMessage"></span>
                        </div>

                        <!-- Sección de Resultado Simple (Texto) -->
                        <div id="resultBox" class="alert alert-success d-none mt-3 text-center fw-bold" role="alert">
                            <span id="resultText"></span>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Script de lógica -->
    <script>
        async function buscarContribuyente() {
            const cedula = document.getElementById('cedulaInput').value.trim();
            const btnConsultar = document.getElementById('btnConsultar');
            const btnSpinner = document.getElementById('btnSpinner');
            const btnText = document.getElementById('btnText');
            const alertBox = document.getElementById('alertBox');
            const alertMessage = document.getElementById('alertMessage');
            const resultBox = document.getElementById('resultBox');
            const resultText = document.getElementById('resultText');

            // Limpiar estados anteriores
            alertBox.classList.add('d-none');
            resultBox.classList.add('d-none');
            resultText.textContent = '';

            if (!cedula) {
                mostrarError('Por favor, ingresa un número de cédula válido.');
                return;
            }

            // Activar estado de carga en el botón
            btnConsultar.disabled = true;
            btnSpinner.classList.remove('d-none');
            btnText.textContent = 'Consultando...';

            const url = `https://contribuyentes.sigat.net/api/v1/contribuyentes/completar-rif?rif=V${cedula}`;

            try {
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`Error en el servidor (${response.status}: ${response.statusText})`);
                }

                // Obtener directamente la respuesta como texto plano
                const textoResultado = await response.text();

                if (!textoResultado || textoResultado.trim() === '') {
                    mostrarError('No se encontraron datos para la cédula ingresada.');
                } else {
                    // Mostrar el resultado simple recibido
                    resultText.textContent = "Rif: " + textoResultado;
                    resultBox.classList.remove('d-none');
                }

            } catch (error) {
                console.error('Fetch error:', error);
                mostrarError(`Error al consultar los datos: ${error.message}`);
            } finally {
                // Restaurar estado del botón
                btnConsultar.disabled = false;
                btnSpinner.classList.add('d-none');
                btnText.innerHTML = '<i class="bi bi-search me-1"></i>Buscar';
            }
        }

        function mostrarError(mensaje) {
            const alertBox = document.getElementById('alertBox');
            const alertMessage = document.getElementById('alertMessage');
            alertMessage.textContent = mensaje;
            alertBox.classList.remove('d-none');
        }
    </script>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
