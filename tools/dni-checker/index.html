<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Cédula</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../common.css">
</head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100">

    <div class="tool-nav">
        <a class="tool-nav-back" href="../../index.html"><i class="bi bi-arrow-left"></i> Volver al panel</a>
        <div class="tool-nav-titles">
            <h1 class="tool-nav-title">Consulta de Cédula</h1>
            <p class="tool-nav-sub">Datos de una persona en el registro venezolano</p>
        </div>
    </div>

    <div class="container my-auto py-4">
        <div class="row justify-content-center g-4">
            <div class="col-md-9 col-lg-7">

                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h2 class="mb-0 hw-card-title"><i class="bi bi-person-vcard me-2"></i>Consulta de Cédula</h2>
                    </div>

                    <div class="card-body p-4">

                        <div id="setupBox" class="alert alert-warning d-none" role="alert">
                            <div class="fw-semibold mb-1"><i class="bi bi-exclamation-triangle-fill me-2"></i><span id="setupTitle"></span></div>
                            <div class="small mb-2" id="setupHint"></div>
                            <div class="small mb-0" id="setupFoot"></div>
                        </div>

                        <form id="searchForm" onsubmit="event.preventDefault(); consultar();">
                            <label for="cedulaInput" class="hw-field-label hw-field-label-emerald mb-2">
                                <i class="bi bi-card-text"></i> Número de cédula
                            </label>
                            <div class="input-group mb-3">
                                <label class="input-group-text bg-white" for="nacionalidad" title="Nacionalidad">
                                    <select id="nacionalidad" class="form-select form-select-sm" style="border: 0; padding: 0; background: transparent; width: auto;">
                                        <option value="v">V</option>
                                        <option value="e">E</option>
                                    </select>
                                </label>
                                <input type="text" id="cedulaInput" class="form-control" placeholder="Ej: 30893191"
                                    inputmode="numeric" autocomplete="off" maxlength="12" required>
                                <button class="btn btn-primary px-4" type="submit" id="btnConsultar">
                                    <span id="btnSpinner" class="spinner-border spinner-border-sm d-none me-1" role="status" aria-hidden="true"></span>
                                    <span id="btnText"><i class="bi bi-search me-1"></i>Buscar</span>
                                </button>
                            </div>
                            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                                <span class="small" style="color: var(--hw-text-muted);"><i class="bi bi-info-circle me-1"></i>V: venezolano · E: extranjero</span>
                                <span id="dConsulta" class="small" style="color: var(--hw-text-muted);"></span>
                            </div>
                        </form>

                        <div id="alertBox" class="alert alert-danger d-none mt-3" role="alert">
                            <i id="alertIcon" class="bi bi-exclamation-triangle-fill me-2"></i><span id="alertMessage"></span>
                        </div>

                        <div id="resultBox" class="d-none mt-4">
                            <div class="hw-box p-3 mb-3">
                                <div class="d-flex align-items-center gap-2 mb-1">
                                    <i class="bi bi-person-circle" style="color: var(--hw-accent);"></i>
                                    <span class="hw-uppercase-label">Titular</span>
                                </div>
                                <div id="dNombre" class="hw-data-name"></div>
                            </div>

                            <div class="hw-data-grid mb-3">
                                <div class="hw-data-cell">
                                    <span class="hw-data-label">Nacionalidad</span>
                                    <span class="hw-data-value" id="dNacionalidad">-</span>
                                </div>
                                <div class="hw-data-cell">
                                    <span class="hw-data-label">Cédula</span>
                                    <span class="hw-data-value" id="dCedula">-</span>
                                </div>
                                <div class="hw-data-cell">
                                    <span class="hw-data-label">RIF</span>
                                    <span class="hw-data-value" id="dRif">-</span>
                                </div>
                                <div class="hw-data-cell">
                                    <span class="hw-data-label">Fecha de nacimiento</span>
                                    <span class="hw-data-value" id="dFecha">-</span>
                                </div>
                                <div class="hw-data-cell" id="dCeldaEdad">
                                    <span class="hw-data-label">Edad</span>
                                    <span class="hw-data-value" id="dEdad">-</span>
                                </div>
                            </div>

                            <div class="row g-2">
                                <div class="col-6">
                                    <button class="btn btn-primary hw-btn-lg w-100" type="button" onclick="copiarDatos();">
                                        <i class="bi bi-clipboard-check me-1"></i>Copiar
                                    </button>
                                </div>
                                <div class="col-6">
                                    <button class="btn hw-btn-lg hw-btn-ghost w-100" type="button" onclick="limpiar();">
                                        <i class="bi bi-eraser me-1"></i>Limpiar
                                    </button>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <div id="toast" class="hw-toast">
        <i id="toastIcon" class="bi bi-check-circle-fill"></i>
        <span id="toastMsg">Mensaje</span>
    </div>

    <script src="config.js"></script>
    <script src="config.local.js"></script>
    <script src="../common.js"></script>

    <script src="script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
